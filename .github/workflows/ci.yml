name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run native test suite
        run: ./scripts/run_tests.sh

      - name: Build macOS application bundle
        run: ./scripts/build_app.sh
